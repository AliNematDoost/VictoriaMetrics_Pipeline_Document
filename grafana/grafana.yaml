apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-pvc
  namespace: monitoring-system
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana-dep
  namespace: monitoring-system
spec:
  replicas: 1
  selector:
    matchLabels:
      monitor: grafana
  template:
    metadata:
      labels:
        monitor: grafana
    spec:
      containers:
        - name: grafana-app
          image: hub.hamdocker.ir/grafana/grafana:latest
          resources:
            requests:
              memory: "128Mi"
              cpu: "200m"
          ports:
            - containerPort: 3000
          volumeMounts:
            - name: grafana-storage
              mountPath: /var/lib/grafana

      volumes:
        - name: grafana-storage
          persistentVolumeClaim:
            claimName: grafana-pvc

---

apiVersion: v1
kind: Service
metadata:
  name: grafana-service
  namespace: monitoring-system
spec:
  selector:
    monitor: grafana
  ports:
    - port: 3000
      targetPort: 3000

---

apiVersion: networking.k8s.io/v1
